services:
- type: worker
  name: votosincero-bot
  runtime: python
  plan: starter
  buildCommand: pip install -r requirements.txt
  startCommand: python main.py
  envVars:
  - key: PYTHON_VERSION
    value: 3.12.12
  - key: BOT_TOKEN
    sync: false
  - key: ADMIN_IDS
    sync: false
  - key: DB_URL
    sync: false
